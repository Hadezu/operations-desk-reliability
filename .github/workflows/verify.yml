name: Operations Desk verification
on:
  push:
    paths-ignore:
      - "README.md"
      - "docs/**"
      - "evidence/**"
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  # GitHub's Ubuntu 24.04 image includes Chrome and its system dependencies.
  # Avoid a second apt installation and its unreliable mirror retries.
  PLAYWRIGHT_CHANNEL: chrome
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-owner-password
          POSTGRES_DB: desk
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres -d desk" --health-interval 3s --health-timeout 3s --health-retries 30
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 3s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql://desk_app:local-app-password@127.0.0.1:5432/desk
      MIGRATION_DATABASE_URL: postgresql://postgres:local-owner-password@127.0.0.1:5432/desk
      REDIS_URL: redis://127.0.0.1:6379
      APP_ORIGIN: http://localhost:3100
      BACKGROUND_MODE: disabled
      NEXT_TELEMETRY_DISABLED: 1
      WRANGLER_SEND_METRICS: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:bootstrap
      - run: npm run db:verify-access
      - run: google-chrome --version
      - run: npm run cf:types
      - run: npm run verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: |
            evidence/
            test-results/
          retention-days: 14
  containers:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: docker compose up --build --wait --wait-timeout 180
      - run: npm ci
      - run: google-chrome --version
      - run: npm run test:e2e
        env:
          E2E_BASE_URL: http://localhost:3100
          EXPECT_REPORT: 1
      - run: docker compose logs --no-color > compose.log
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-evidence
          path: |
            compose.log
            evidence/playwright.json
            test-results/
      - run: docker compose down --volumes
        if: always()
  release-evidence:
    needs: [integration, containers]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: verification-evidence
          path: .local/ci/integration
      - uses: actions/download-artifact@v4
        with:
          name: container-evidence
          path: .local/ci/containers
      - run: node --import tsx scripts/merge-ci-evidence.ts
        env:
          INTEGRATION_JOB_RESULT: ${{ needs.integration.result }}
          CONTAINER_JOB_RESULT: ${{ needs.containers.result }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-proof
          path: evidence/manifest.json
          retention-days: 90
